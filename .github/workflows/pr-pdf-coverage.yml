name: PR PDF Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR coverage PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"

      - name: Install Typst
        uses: typst-community/setup-typst@6a2cfaf0b28d636b00148f965e315bae81079aaa # v5.3.1
        with:
          typst-version: ^0.14.2

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Show Typst and Pandoc versions
        run: |
          typst --version
          pandoc --version | head -n1

      - name: Generate PR coverage PDFs
        run: |
          chmod +x scripts/pr-pdf-coverage.sh
          ./scripts/pr-pdf-coverage.sh \
            --project-id "pr-${{ github.event.pull_request.number }}-${{ github.sha }}" \
            --output-dir dist/pr-pdf-coverage

      - name: Upload PR coverage PDFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-pdf-coverage-${{ github.event.pull_request.number }}
          path: dist/pr-pdf-coverage/

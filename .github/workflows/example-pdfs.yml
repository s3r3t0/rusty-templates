name: Example PDFs

on:
  workflow_call:
    inputs:
      version:
        description: Release version to stamp into the generated files
        required: true
        type: string
      artifact-prefix:
        description: Prefix for the uploaded artifact name
        required: false
        default: example-pdfs
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stamp into the generated files
        required: true
        type: string
      artifact-prefix:
        description: Prefix for the uploaded artifact name
        required: false
        default: example-pdfs
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build example PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest-known"

      - name: Install Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ^0.14.2

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Show Typst and Pandoc versions
        run: |
          typst --version
          pandoc --version | head -n1

      - name: Generate example PDFs
        run: bash release.sh --version "${{ inputs.version }}"

      - name: Upload example PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-prefix'] }}-${{ inputs.version }}
          path: dist/example-pdfs/
name: Example PDFs

on:
  workflow_call:
    inputs:
      version:
        description: Release version to stamp into the generated files
        required: true
        type: string
      artifact-prefix:
        description: Prefix for the uploaded artifact name
        required: false
        default: example-pdfs
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stamp into the generated files
        required: true
        type: string
      artifact-prefix:
        description: Prefix for the uploaded artifact name
        required: false
        default: example-pdfs
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build example PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"

      - name: Install Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ^0.14.2

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Show Typst and Pandoc versions
        run: |
          typst --version
          pandoc --version | head -n1

      - name: Generate example PDFs
        run: bash release.sh --version "${{ inputs.version }}" --output-dir dist/example-pdfs

      - name: Upload example PDFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs['artifact-prefix'] }}-${{ inputs.version }}
          path: dist/example-pdfs/